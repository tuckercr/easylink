[versions]
# Build tooling
agp                     = "9.2.1"
kotlin                  = "2.4.0"
ksp                     = "2.3.8"

# AndroidX core
coreKtx                 = "1.19.0"
appcompat               = "1.7.1"

# Lifecycle / ViewModel
lifecycle               = "2.10.0"

# Navigation
navigation              = "2.9.8"

# Dependency Injection
hilt                    = "2.59.2"

# Coroutines
coroutines              = "1.11.0"

# Room (local database for emergency contacts)
room                    = "2.8.4"

# Location (FusedLocationProvider for GPS coordinates in SOS)
playServicesLocation    = "21.3.0"

# DataStore (persisting TTS preferences)
datastore               = "1.2.1"

# Camera (CameraX replaces deprecated Camera API)
camerax                 = "1.6.1"

# Testing
junit                   = "4.13.2"
junitExt                = "1.3.0"
espresso                = "3.7.0"
mockk                   = "1.14.11"
coroutinesTest          = "1.11.0"
turbine                 = "1.2.1"

# Coil — Kotlin-first image loading (contact photos on Speed Dial)
coil                    = "2.7.0"

# ktlint
ktlint                  = "14.2.0"

# Compose
compose-bom             = "2026.05.01"
hilt-navigation-compose = "1.3.0"

desugar-jdk             = "2.1.5"
startup                 = "1.2.0"

[libraries]
android-desugar-jdk              = { group = "com.android.tools",           name = "desugar_jdk_libs",             version.ref = "desugar-jdk" }
# Core
androidx-core-ktx                = { group = "androidx.core",              name = "core-ktx",                     version.ref = "coreKtx" }
androidx-appcompat               = { group = "androidx.appcompat",         name = "appcompat",                    version.ref = "appcompat" }

# Lifecycle
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle",        name = "lifecycle-viewmodel-ktx",      version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx   = { group = "androidx.lifecycle",        name = "lifecycle-runtime-ktx",        version.ref = "lifecycle" }

# Hilt
hilt-android                     = { group = "com.google.dagger",         name = "hilt-android",                 version.ref = "hilt" }
hilt-compiler                    = { group = "com.google.dagger",         name = "hilt-android-compiler",        version.ref = "hilt" }

# Coroutines
kotlinx-coroutines-android       = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-android",   version.ref = "coroutines" }

# Room
room-runtime                     = { group = "androidx.room",             name = "room-runtime",                 version.ref = "room" }
room-ktx                         = { group = "androidx.room",             name = "room-ktx",                     version.ref = "room" }
room-compiler                    = { group = "androidx.room",             name = "room-compiler",                version.ref = "room" }
room-testing                     = { group = "androidx.room",             name = "room-testing",                 version.ref = "room" }

# Location
play-services-location           = { group = "com.google.android.gms",   name = "play-services-location",       version.ref = "playServicesLocation" }

# DataStore
datastore-preferences            = { group = "androidx.datastore",        name = "datastore-preferences",        version.ref = "datastore" }

# CameraX
camerax-core                     = { group = "androidx.camera",           name = "camera-core",                  version.ref = "camerax" }
camerax-camera2                  = { group = "androidx.camera",           name = "camera-camera2",               version.ref = "camerax" }
camerax-lifecycle                = { group = "androidx.camera",           name = "camera-lifecycle",             version.ref = "camerax" }
camerax-view                     = { group = "androidx.camera",           name = "camera-view",                  version.ref = "camerax" }

# Testing
junit                            = { group = "junit",                     name = "junit",                        version.ref = "junit" }
androidx-junit                   = { group = "androidx.test.ext",         name = "junit",                        version.ref = "junitExt" }
androidx-espresso-core           = { group = "androidx.test.espresso",    name = "espresso-core",                version.ref = "espresso" }
mockk                            = { group = "io.mockk",                  name = "mockk",                        version.ref = "mockk" }
kotlinx-coroutines-test          = { group = "org.jetbrains.kotlinx",    name = "kotlinx-coroutines-test",      version.ref = "coroutinesTest" }
turbine                          = { group = "app.cash.turbine",          name = "turbine",                      version.ref = "turbine" }

# Coil
coil-compose                     = { group = "io.coil-kt",                 name = "coil-compose",                 version.ref = "coil" }

# Compose (versions come from BOM — no version.ref on individual artifacts)
compose-bom                      = { group = "androidx.compose",           name = "compose-bom",                  version.ref = "compose-bom" }
compose-ui                       = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-tooling-preview       = { group = "androidx.compose.ui",        name = "ui-tooling-preview" }
compose-ui-tooling               = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3                = { group = "androidx.compose.material3", name = "material3" }
compose-foundation               = { group = "androidx.compose.foundation",name = "foundation" }
navigation-compose               = { group = "androidx.navigation",        name = "navigation-compose",           version.ref = "navigation" }
hilt-navigation-compose          = { group = "androidx.hilt",              name = "hilt-navigation-compose",      version.ref = "hilt-navigation-compose" }
lifecycle-runtime-compose        = { group = "androidx.lifecycle",         name = "lifecycle-runtime-compose",    version.ref = "lifecycle" }
startup-runtime                  = { group = "androidx.startup",            name = "startup-runtime",              version.ref = "startup" }

[plugins]
android-application  = { id = "com.android.application",              version.ref = "agp" }
kotlin-parcelize     = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",   version.ref = "kotlin" }
hilt                 = { id = "com.google.dagger.hilt.android",        version.ref = "hilt" }
ksp                  = { id = "com.google.devtools.ksp",               version.ref = "ksp" }
ktlint               = { id = "org.jlleitschuh.gradle.ktlint",         version.ref = "ktlint" }
