name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # google-services.json is not in the repo (see .gitignore). It is stored as a
    # base64 secret so CI can build the Firebase-enabled variants.
    # To encode: base64 -i app/google-services.json | pbcopy
    # One file covers both modules — it contains a client for every app id.
    - name: Restore google-services.json
      env:
        GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      run: |
        if [ -z "$GOOGLE_SERVICES_JSON" ]; then
          echo "::error::GOOGLE_SERVICES_JSON secret is not set — the google-services plugin will fail."
          exit 1
        fi
        echo "$GOOGLE_SERVICES_JSON" | base64 --decode > app/google-services.json
        cp app/google-services.json care/google-services.json

    - name: Run Lint and Tests
      run: |
        ./gradlew ktlintCheck lint test build

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk
